<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin :: Implementare</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-hero {
    padding: 40px 0 24px;
    border-bottom: 1px solid var(--line-soft);
  }
  .admin-hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(28px, 4vw, 40px);
    margin-bottom: 6px;
  }
  .admin-hero p { font-size: 15px; color: var(--ink-soft); }

  .admin-table {
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    overflow: hidden;
    overflow-x: auto;
    margin-top: 32px;
  }

  table.adm {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 900px;
  }
  table.adm thead { background: var(--paper-warm); }
  table.adm th {
    text-align: left;
    padding: 14px 16px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.adm td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  table.adm tr:hover td { background: var(--paper); }
  table.adm tr:last-child td { border-bottom: none; }

  .adm-nome {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 2px;
    display: block;
  }
  .adm-email {
    font-size: 12px;
    color: var(--ink-muted);
  }

  .fase-pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .fase-pill.expansao { background: var(--terracotta-soft); color: var(--terracotta); }
  .fase-pill.evolucao { background: var(--orange-soft); color: var(--orange); }
  .fase-pill.nova-fase { background: var(--lime-soft); color: var(--teal-dark); }
  .fase-pill.sem-fase { background: var(--paper-warm); color: var(--ink-muted); }

  .adm-stats {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
  }
  .adm-stats strong { color: var(--ink); font-family: 'Fraunces', serif; font-size: 14px; }

  .fase-edit-select {
    font-size: 12px;
    padding: 6px 10px;
    width: auto;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
  }
  .modal-overlay.visible { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    margin-bottom: 16px;
  }
  .modal-close {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--ink-muted);
    float: right;
  }
  .modal-close:hover { color: var(--ink); }

  .resumo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }
  .resumo-cell {
    background: var(--paper-warm);
    padding: 12px 16px;
    border-radius: 8px;
  }
  .resumo-cell strong {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    display: block;
    color: var(--ink);
    line-height: 1;
  }
  .resumo-cell span {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-top: 4px;
    display: block;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading"></div>
</div>

<div id="headerSlot"></div>

<section class="admin-hero">
  <div class="container">
    <h1>Painel admin</h1>
    <p>Veja todas as clientes que estão usando a ferramenta. Clique para ver o estado de cada uma.</p>
  </div>
</section>

<section style="padding: 24px 0 80px;">
  <div class="container">
    <div id="adminContent">
      <div class="empty-state"><span class="loading"></span> Carregando clientes...</div>
    </div>
  </div>
</section>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) fecharModal()">
  <div class="modal-box" id="modalContent"></div>
</div>

<footer>
  <div class="container">
    <p>Admin :: <strong>Implementare</strong></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="icons.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="header.js"></script>
<script>
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let usuarias = [];

function faseClass(f) {
  if (f === 'expansao') return 'expansao';
  if (f === 'evolucao') return 'evolucao';
  if (f === 'nova-fase') return 'nova-fase';
  return 'sem-fase';
}

function faseLabel(f) {
  if (f === 'expansao') return 'Expansão';
  if (f === 'evolucao') return 'Evolução';
  if (f === 'nova-fase') return 'Nova Fase';
  return 'Sem fase';
}

function formatDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('pt-BR');
}

async function carregar() {
  usuarias = await window.AppAuth.adminListarUsuarias();

  // pra cada usuária, carrega estado (em paralelo, só de quem não é a própria Fa)
  const promises = usuarias.map(async u => {
    if (u.is_admin) { u._estado = null; return; }
    const dados = await window.AppAuth.adminCarregarEstadoUsuaria(u.id);
    u._estado = dados ? dados.estado : null;
    u._atualizado = dados ? dados.atualizado_em : null;
  });
  await Promise.all(promises);

  render();
}

function render() {
  const cont = document.getElementById('adminContent');
  const naoAdmin = usuarias.filter(u => !u.is_admin);

  if (naoAdmin.length === 0) {
    cont.innerHTML = `
      <div class="empty-state">
        <strong>Nenhuma cliente cadastrada ainda.</strong>
        <p>Quando alguma cliente criar conta, ela aparece aqui.</p>
      </div>`;
    return;
  }

  cont.innerHTML = `
    <div class="admin-table">
      <table class="adm">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Especialidade</th>
            <th>Fase</th>
            <th>Mapeamento</th>
            <th>Última atualização</th>
            <th>Cadastrada em</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${naoAdmin.map(u => {
            const e = u._estado || { rows: [], areasFinalizadas: [] };
            const totalRows = (e.rows || []).length;
            const delegadas = (e.rows || []).filter(r => r.delegar).length;
            const areasOk = (e.areasFinalizadas || []).length;
            return `
              <tr>
                <td>
                  <span class="adm-nome">${escapeHtml(u.nome)}</span>
                  <span class="adm-email">${escapeHtml(u.email)}</span>
                </td>
                <td>${escapeHtml(u.especialidade || '-')}</td>
                <td>
                  <select class="fase-edit-select" onchange="atualizarFase('${u.id}', this.value)">
                    <option value="" ${!u.fase ? 'selected' : ''}>sem fase</option>
                    <option value="expansao" ${u.fase==='expansao' ? 'selected' : ''}>Expansão</option>
                    <option value="evolucao" ${u.fase==='evolucao' ? 'selected' : ''}>Evolução</option>
                    <option value="nova-fase" ${u.fase==='nova-fase' ? 'selected' : ''}>Nova Fase</option>
                  </select>
                </td>
                <td>
                  <div class="adm-stats">
                    <strong>${totalRows}</strong> atividades<br>
                    <strong>${delegadas}</strong> delegando<br>
                    <strong>${areasOk}</strong> áreas concluídas
                  </div>
                </td>
                <td>${u._atualizado ? formatDate(u._atualizado) : '-'}</td>
                <td>${formatDate(u.criado_em)}</td>
                <td>
                  <button class="btn" onclick="verDetalhes('${u.id}')">${window.Icons.eye} Ver</button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function atualizarFase(userId, fase) {
  const ok = await window.AppAuth.adminAtualizarFase(userId, fase);
  if (!ok) { alert('Erro ao atualizar fase.'); return; }
  // atualiza local
  const u = usuarias.find(x => x.id === userId);
  if (u) u.fase = fase;
}

function verDetalhes(userId) {
  const u = usuarias.find(x => x.id === userId);
  if (!u) return;
  const e = u._estado || { rows: [], areasFinalizadas: [], selectedICP: '' };

  const delegadas = (e.rows || []).filter(r => r.delegar);
  const areasOk = (e.areasFinalizadas || []).length;
  let totalEst = 0, totalTat = 0, totalOpe = 0;
  (e.rows || []).forEach(r => {
    if (r.pilar === 'Estratégico') totalEst++;
    else if (r.pilar === 'Tático') totalTat++;
    else if (r.pilar === 'Operacional') totalOpe++;
  });

  const linhas = (e.rows || []).map((r, i) => `
    <tr>
      <td style="font-family:Fraunces,serif;color:var(--ink-muted);">${i+1}</td>
      <td>${escapeHtml(r.micro || r.macro || '-')}</td>
      <td><span style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--paper-warm);">${escapeHtml(r.pilar || '-')}</span></td>
      <td style="font-size:12px;color:var(--ink-muted);">${escapeHtml(r.area || '-')}</td>
      <td style="text-align:center;">${r.delegar ? window.Icons.check : ''}</td>
      <td style="font-size:12px;color:var(--ink-muted);">${escapeHtml(r.statusStart || r.statusProcesso || '-')}</td>
    </tr>
  `).join('');

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="fecharModal()">${window.Icons.x}</button>
    <h2>${escapeHtml(u.nome)}</h2>
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:6px;">${escapeHtml(u.email)} · ${escapeHtml(u.especialidade || 'sem especialidade')}</p>
    <p style="font-size:12px;color:var(--ink-muted);margin-bottom:18px;">
      Fase: <span class="fase-pill ${faseClass(u.fase)}">${faseLabel(u.fase)}</span>
      ${e.selectedICP ? ` · Ela escolheu: <strong>${faseLabel(e.selectedICP)}</strong>` : ''}
    </p>

    <div class="resumo-grid">
      <div class="resumo-cell"><strong>${(e.rows || []).length}</strong><span>Atividades</span></div>
      <div class="resumo-cell"><strong>${delegadas.length}</strong><span>Delegando</span></div>
      <div class="resumo-cell"><strong>${areasOk}</strong><span>Áreas concluídas</span></div>
      <div class="resumo-cell"><strong>${totalEst}/${totalTat}/${totalOpe}</strong><span>E/T/O</span></div>
    </div>

    ${(e.rows || []).length === 0 ? '<p style="color:var(--ink-muted);font-style:italic;">Nenhuma atividade mapeada ainda.</p>' : `
      <div style="overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px;margin-top:16px;">
        <table class="adm" style="min-width:600px;">
          <thead>
            <tr>
              <th></th>
              <th>Atividade</th>
              <th>Nível</th>
              <th>Área</th>
              <th>Delegar</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    `}
  `;
  document.getElementById('modal').classList.add('visible');
}

function fecharModal() {
  document.getElementById('modal').classList.remove('visible');
}

(async function() {
  const auth = await window.AppAuth.requireAdmin();
  if (!auth) return;
  await window.renderHeader('admin');
  await carregar();
  document.getElementById('loadingOverlay').classList.add('hidden');
})();
</script>

</body>
</html>

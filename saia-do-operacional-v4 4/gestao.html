<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão diária :: Implementare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .gestao-hero {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--line-soft);
  }
  .gestao-hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(32px, 4.5vw, 48px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .gestao-hero h1 em { font-style: italic; color: var(--teal); }
  .gestao-hero p {
    font-size: 16px;
    color: var(--ink-soft);
    max-width: 640px;
    line-height: 1.6;
  }

  .gestao-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-top: 28px;
    max-width: 800px;
  }
  .gstat {
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .gstat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .gstat-value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    line-height: 1;
  }
  .gstat.acc-teal .gstat-value { color: var(--teal); }
  .gstat.acc-orange .gstat-value { color: var(--orange); }
  .gstat.acc-lime .gstat-value { color: var(--lime); }
  .gstat.acc-terracotta .gstat-value { color: var(--terracotta); }

  /* filter bar */
  .filter-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 32px 0 24px;
    flex-wrap: wrap;
  }
  .filter-pill {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--white);
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-soft);
    font-weight: 500;
    transition: all 0.15s ease;
    font-family: 'Inter', sans-serif;
  }
  .filter-pill:hover { border-color: var(--teal); color: var(--teal); }
  .filter-pill.active { background: var(--teal); color: white; border-color: var(--teal); }

  /* delegacao card */
  .deleg-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .deleg-card {
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 24px 28px;
    transition: border-color 0.15s ease;
  }
  .deleg-card:hover { border-color: var(--line); }

  .deleg-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .deleg-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 4px;
  }

  .deleg-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .deleg-meta span { display: inline-flex; align-items: center; gap: 4px; }

  .deleg-status-pill {
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .deleg-status-pill.fase-1 { background: var(--teal-soft); color: var(--teal); }
  .deleg-status-pill.fase-2 { background: var(--orange-soft); color: var(--orange); }
  .deleg-status-pill.fase-3 { background: var(--lime-soft); color: var(--teal-dark); }
  .deleg-status-pill.fase-ok { background: var(--lime); color: white; }
  .deleg-status-pill.fase-vol { background: var(--terracotta-soft); color: var(--terracotta); }

  /* Box de "como tá" */
  .deleg-detalhes {
    background: var(--paper-warm);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 12px 0;
    line-height: 1.5;
  }
  .deleg-detalhes strong {
    color: var(--ink);
    display: inline-block;
    min-width: 90px;
  }
  .deleg-detalhes a {
    color: var(--teal);
    word-break: break-all;
  }
  .deleg-detalhes-row { margin-bottom: 4px; }
  .deleg-detalhes-row:last-child { margin-bottom: 0; }

  /* form de log */
  .deleg-log-form {
    border-top: 1px solid var(--line-soft);
    padding-top: 16px;
    margin-top: 12px;
  }
  .deleg-log-form h4 {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-bottom: 10px;
  }
  .log-status-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .log-status-options label {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--white);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .log-status-options label:hover { border-color: var(--teal); }
  .log-status-options label input { display: none; }
  .log-status-options label.active.rodou-bem { background: var(--lime); color: white; border-color: var(--lime); }
  .log-status-options label.active.ajustar { background: var(--orange); color: white; border-color: var(--orange); }
  .log-status-options label.active.voltou { background: var(--terracotta); color: white; border-color: var(--terracotta); }
  .log-status-options label.active.concluido { background: var(--teal); color: white; border-color: var(--teal); }

  .log-form-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .log-form-row textarea {
    flex: 1;
    min-width: 200px;
    min-height: 50px;
  }

  /* histórico */
  .deleg-historico {
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px dashed var(--line-soft);
  }
  .historico-toggle {
    background: transparent;
    border: none;
    color: var(--teal);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Inter', sans-serif;
  }
  .historico-toggle:hover { text-decoration: underline; }

  .historico-list {
    margin-top: 12px;
    display: none;
  }
  .historico-list.visible { display: block; }

  .historico-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13px;
  }
  .historico-item:last-child { border-bottom: none; }
  .historico-data {
    flex-shrink: 0;
    color: var(--ink-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    width: 100px;
    padding-top: 2px;
  }
  .historico-content { flex: 1; }
  .historico-status {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .historico-status.rodou-bem { background: var(--lime-soft); color: var(--teal-dark); }
  .historico-status.ajustar { background: var(--orange-soft); color: var(--orange); }
  .historico-status.voltou { background: var(--terracotta-soft); color: var(--terracotta); }
  .historico-status.concluido { background: var(--teal-soft); color: var(--teal); }
  .historico-obs { color: var(--ink); line-height: 1.5; }
  .historico-remove {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    cursor: pointer;
    padding: 4px;
    font-size: 11px;
  }
  .historico-remove:hover { color: var(--terracotta); }

  /* prioritárias do dia */
  .prioridade-banner {
    background: linear-gradient(135deg, var(--teal-soft), var(--lime-soft));
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 32px;
  }
  .prioridade-banner h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    color: var(--teal-dark);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .prioridade-banner p {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  /* empty */
  .empty-block {
    text-align: center;
    padding: 80px 20px;
    background: var(--white);
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .empty-block h3 {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .empty-block p {
    color: var(--ink-muted);
    font-size: 14px;
    margin-bottom: 18px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.55;
  }

  @media (max-width: 800px) {
    .deleg-card { padding: 20px; }
    .historico-data { width: 80px; font-size: 10px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading"></div>
</div>

<div id="headerSlot"></div>

<section class="gestao-hero">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div style="flex:1;min-width:280px;">
        <h1>Gestão <em>diária</em>.</h1>
        <p>Aqui você acompanha as delegações no dia a dia. Marca o que rodou bem, o que precisa de ajuste, e o que voltou pra sua mão. Sem isso, o plano é só intenção.</p>
      </div>
      <button class="btn" id="btnRecarregar" onclick="recarregar()" title="Buscar dados mais recentes do Supabase">
        <span id="iconReload"></span> atualizar
      </button>
    </div>
    <div class="gestao-stats" id="gestaoStats"></div>
  </div>
</section>

<section style="padding: 40px 0 80px;">
  <div class="container">
    <div id="prioridadeSlot"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div id="delegList"></div>
  </div>
</section>

<footer>
  <div class="container">
    <p>Saia do Operacional :: ferramenta de aceleração comercial <strong>Implementare</strong></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="icons.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="header.js"></script>
<script>
let estado = null;
let logsByRow = {}; // id -> array de logs
let filtroAtual = 'todas'; // todas, pendentes, rodando, voltaram, concluidas

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getFase(r) {
  // Fase do plano em que a delegação está
  // Fase 1 :: precisa desenhar processo (ainda não pronto)
  // Fase 2 :: processo pronto mas não começou
  // Fase 3 :: começou, em acompanhamento
  // ok :: deu certo (concluido em qualquer log recente)
  // voltou :: voltou pra mão dela

  const lastLog = (logsByRow[r.id] || [])[0]; // mais recente
  if (lastLog) {
    if (lastLog.status === 'concluido') return { fase: 'ok', label: 'Concluída', cls: 'fase-ok' };
    if (lastLog.status === 'voltou') return { fase: 'voltou', label: 'Voltou pra mim', cls: 'fase-vol' };
  }

  const processoPronto = r.jaTemProcesso === 'sim' || r.statusProcesso === 'Concluído';
  const startFeito = r.statusStart === 'Concluído';

  if (!processoPronto) return { fase: 1, label: 'Fase 1: desenhando processo', cls: 'fase-1' };
  if (!startFeito) return { fase: 2, label: 'Fase 2: pronta para começar', cls: 'fase-2' };
  return { fase: 3, label: 'Fase 3: em acompanhamento', cls: 'fase-3' };
}

function getDeleg() {
  if (!estado) return [];
  return (estado.rows || []).filter(r => r.delegar && (r.micro || r.macro));
}

function renderStats() {
  const slot = document.getElementById('gestaoStats');
  const all = getDeleg();
  const total = all.length;
  let f1 = 0, f2 = 0, f3 = 0, ok = 0, vol = 0;
  all.forEach(r => {
    const f = getFase(r);
    if (f.fase === 1) f1++;
    else if (f.fase === 2) f2++;
    else if (f.fase === 3) f3++;
    else if (f.fase === 'ok') ok++;
    else if (f.fase === 'voltou') vol++;
  });
  slot.innerHTML = `
    <div class="gstat acc-teal">
      <div class="gstat-label">Total delegando</div>
      <div class="gstat-value">${total}</div>
    </div>
    <div class="gstat acc-orange">
      <div class="gstat-label">Em andamento</div>
      <div class="gstat-value">${f1 + f2 + f3}</div>
    </div>
    <div class="gstat acc-lime">
      <div class="gstat-label">Concluídas</div>
      <div class="gstat-value">${ok}</div>
    </div>
    <div class="gstat acc-terracotta">
      <div class="gstat-label">Voltaram pra você</div>
      <div class="gstat-value">${vol}</div>
    </div>
  `;
}

function renderFilters() {
  const all = getDeleg();
  const counts = { todas: all.length, fase1: 0, fase2: 0, fase3: 0, voltaram: 0, concluidas: 0 };
  all.forEach(r => {
    const f = getFase(r);
    if (f.fase === 1) counts.fase1++;
    else if (f.fase === 2) counts.fase2++;
    else if (f.fase === 3) counts.fase3++;
    else if (f.fase === 'ok') counts.concluidas++;
    else if (f.fase === 'voltou') counts.voltaram++;
  });

  const slot = document.getElementById('filterBar');
  slot.innerHTML = `
    <button class="filter-pill ${filtroAtual==='todas'?'active':''}" onclick="setFiltro('todas')">Todas (${counts.todas})</button>
    <button class="filter-pill ${filtroAtual==='fase1'?'active':''}" onclick="setFiltro('fase1')">Desenhando processo (${counts.fase1})</button>
    <button class="filter-pill ${filtroAtual==='fase2'?'active':''}" onclick="setFiltro('fase2')">Pronta pra começar (${counts.fase2})</button>
    <button class="filter-pill ${filtroAtual==='fase3'?'active':''}" onclick="setFiltro('fase3')">Acompanhando (${counts.fase3})</button>
    <button class="filter-pill ${filtroAtual==='voltaram'?'active':''}" onclick="setFiltro('voltaram')">Voltaram (${counts.voltaram})</button>
    <button class="filter-pill ${filtroAtual==='concluidas'?'active':''}" onclick="setFiltro('concluidas')">Concluídas (${counts.concluidas})</button>
  `;
}

function setFiltro(f) {
  filtroAtual = f;
  renderFilters();
  renderList();
}

function renderPrioridade() {
  const all = getDeleg();
  const slot = document.getElementById('prioridadeSlot');

  // prioridades do dia: voltaram (urgente) + fase 3 com mais de 7 dias sem log + fase 2 prontas para começar
  const voltaram = all.filter(r => getFase(r).fase === 'voltou');
  const semLog = all.filter(r => {
    const fa = getFase(r);
    if (fa.fase !== 3) return false;
    const last = (logsByRow[r.id] || [])[0];
    if (!last) return true;
    const ageDays = (Date.now() - new Date(last.criado_em).getTime()) / (1000*60*60*24);
    return ageDays > 7;
  });

  if (voltaram.length === 0 && semLog.length === 0) {
    slot.innerHTML = '';
    return;
  }

  let msg = '';
  if (voltaram.length > 0) {
    msg += `<strong>${voltaram.length}</strong> ${voltaram.length === 1 ? 'delegação voltou' : 'delegações voltaram'} pra sua mão. Trate primeiro: o que falta para rodar de novo? Falta de processo, falta de pessoa certa, ou falta de ferramenta?`;
  }
  if (semLog.length > 0) {
    if (msg) msg += '<br><br>';
    msg += `<strong>${semLog.length}</strong> ${semLog.length === 1 ? 'delegação está' : 'delegações estão'} em acompanhamento sem registro há mais de 7 dias. Vale dar um check.`;
  }

  slot.innerHTML = `
    <div class="prioridade-banner">
      <h2>Atenção do dia</h2>
      <p>${msg}</p>
    </div>
  `;
}

function renderList() {
  const slot = document.getElementById('delegList');
  let all = getDeleg();

  // filtra
  if (filtroAtual !== 'todas') {
    all = all.filter(r => {
      const f = getFase(r);
      if (filtroAtual === 'fase1') return f.fase === 1;
      if (filtroAtual === 'fase2') return f.fase === 2;
      if (filtroAtual === 'fase3') return f.fase === 3;
      if (filtroAtual === 'voltaram') return f.fase === 'voltou';
      if (filtroAtual === 'concluidas') return f.fase === 'ok';
      return true;
    });
  }

  if (getDeleg().length === 0) {
    slot.innerHTML = `
      <div class="empty-block">
        <h3>Nenhuma delegação ainda</h3>
        <p>Você não marcou nenhuma atividade pra delegar. Volta na ferramenta, lista suas atividades e marca o que outra pessoa pode tocar.</p>
        <a href="app.html" class="btn btn-primary">${window.Icons.arrowLeft} ir para a ferramenta</a>
      </div>
    `;
    return;
  }

  if (all.length === 0) {
    slot.innerHTML = `
      <div class="empty-block">
        <h3>Nada nesse filtro</h3>
        <p>Não tem delegação nessa categoria agora. Tenta outro filtro.</p>
      </div>
    `;
    return;
  }

  slot.innerHTML = `<div class="deleg-list">${all.map(renderCard).join('')}</div>`;
}

function renderCard(r) {
  const fa = getFase(r);
  const logs = logsByRow[r.id] || [];

  // detalhes do plano
  const detalhes = [];
  if (r.praQuem) detalhes.push(`<div class="deleg-detalhes-row"><strong>Pra quem:</strong> ${escapeHtml(r.praQuem)}</div>`);
  if (r.dataStart) detalhes.push(`<div class="deleg-detalhes-row"><strong>Iniciou em:</strong> ${formatDate(r.dataStart)}</div>`);
  if (r.formaAcompanhamento) detalhes.push(`<div class="deleg-detalhes-row"><strong>Acompanho:</strong> ${escapeHtml(r.formaAcompanhamento)}</div>`);
  if (r.linkProcesso || r.linkProcessoExistente) {
    const link = r.linkProcesso || r.linkProcessoExistente;
    detalhes.push(`<div class="deleg-detalhes-row"><strong>Processo:</strong> <a href="${escapeHtml(link)}" target="_blank" rel="noopener">${escapeHtml(link)}</a></div>`);
  }
  const detalhesHtml = detalhes.length > 0
    ? `<div class="deleg-detalhes">${detalhes.join('')}</div>`
    : '';

  // metadados
  const metaParts = [];
  if (r.area) metaParts.push(`<span>${escapeHtml(r.area)}</span>`);
  if (r.freq) metaParts.push(`<span>${escapeHtml(r.freq)}</span>`);
  if (r.tempo) metaParts.push(`<span>${escapeHtml(r.tempo)}</span>`);
  if (r.prioridade) metaParts.push(`<span>prio. ${escapeHtml(r.prioridade.toLowerCase())}</span>`);
  const metaHtml = metaParts.length > 0 ? `<div class="deleg-meta">${metaParts.join('')}</div>` : '';

  // form de log
  const formHtml = `
    <div class="deleg-log-form">
      <h4>Como tá rodando? (registra agora)</h4>
      <div class="log-status-options" id="logOpts-${r.id}">
        <label class="rodou-bem" data-status="rodou-bem" onclick="setLogStatus('${r.id}', 'rodou-bem')">${window.Icons.check} Rodou bem</label>
        <label class="ajustar" data-status="ajustar" onclick="setLogStatus('${r.id}', 'ajustar')">${window.Icons.alert} Precisa ajustar</label>
        <label class="voltou" data-status="voltou" onclick="setLogStatus('${r.id}', 'voltou')">${window.Icons.x} Voltou pra mim</label>
        <label class="concluido" data-status="concluido" onclick="setLogStatus('${r.id}', 'concluido')">${window.Icons.circleCheck} Concluído (rodou 30d)</label>
      </div>
      <div class="log-form-row">
        <textarea id="logObs-${r.id}" placeholder="O que aconteceu? O que ajustar? (opcional)"></textarea>
        <button class="btn btn-primary" onclick="salvarLog('${r.id}')">${window.Icons.plus} Registrar</button>
      </div>
    </div>
  `;

  // histórico
  const histHtml = logs.length > 0 ? `
    <div class="deleg-historico">
      <button class="historico-toggle" onclick="toggleHist('${r.id}')">
        ${window.Icons.calendar} Histórico (${logs.length} ${logs.length === 1 ? 'registro' : 'registros'})
      </button>
      <div class="historico-list" id="hist-${r.id}">
        ${logs.map(l => `
          <div class="historico-item">
            <div class="historico-data">${formatDateTime(l.criado_em)}</div>
            <div class="historico-content">
              <span class="historico-status ${l.status}">${labelStatus(l.status)}</span>
              ${l.observacao ? `<div class="historico-obs">${escapeHtml(l.observacao)}</div>` : ''}
            </div>
            <button class="historico-remove" onclick="apagarLog('${l.id}')" title="apagar">${window.Icons.trash}</button>
          </div>
        `).join('')}
      </div>
    </div>
  ` : '';

  return `
    <div class="deleg-card">
      <div class="deleg-head">
        <div style="flex:1; min-width: 200px;">
          <div class="deleg-title">${escapeHtml(r.micro || r.macro || 'Atividade')}</div>
          ${metaHtml}
        </div>
        <span class="deleg-status-pill ${fa.cls}">${fa.label}</span>
      </div>
      ${detalhesHtml}
      ${formHtml}
      ${histHtml}
    </div>
  `;
}

function labelStatus(s) {
  return ({
    'rodou-bem': 'rodou bem',
    'ajustar': 'precisa ajustar',
    'voltou': 'voltou pra mim',
    'concluido': 'concluído'
  })[s] || s;
}

function formatDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('pt-BR');
}

function formatDateTime(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

let logStatusSelecionado = {};

function setLogStatus(rowId, status) {
  logStatusSelecionado[rowId] = status;
  const opts = document.getElementById('logOpts-' + rowId);
  if (!opts) return;
  opts.querySelectorAll('label').forEach(l => {
    l.classList.toggle('active', l.dataset.status === status);
  });
}

async function salvarLog(rowId) {
  const status = logStatusSelecionado[rowId];
  if (!status) {
    alert('Escolhe uma opção (rodou bem, precisa ajustar, voltou pra mim ou concluído).');
    return;
  }
  const obsEl = document.getElementById('logObs-' + rowId);
  const obs = obsEl ? obsEl.value.trim() : '';

  const btn = obsEl ? obsEl.parentElement.querySelector('button') : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading"></span> registrando...'; }

  const log = await window.AppAuth.adicionarLog(rowId, status, obs);
  if (!log) {
    if (btn) { btn.disabled = false; btn.innerHTML = window.Icons.plus + ' Registrar'; }
    alert('Erro ao salvar. Tenta de novo.');
    return;
  }

  // atualiza local
  if (!logsByRow[rowId]) logsByRow[rowId] = [];
  logsByRow[rowId].unshift(log);
  delete logStatusSelecionado[rowId];

  renderStats();
  renderFilters();
  renderPrioridade();
  renderList();
}

async function apagarLog(logId) {
  if (!confirm('Apagar esse registro?')) return;
  const ok = await window.AppAuth.removerLog(logId);
  if (!ok) {
    alert('Erro ao apagar.');
    return;
  }
  // tira do estado local
  Object.keys(logsByRow).forEach(rowId => {
    logsByRow[rowId] = logsByRow[rowId].filter(l => l.id !== logId);
  });
  renderStats();
  renderFilters();
  renderPrioridade();
  renderList();
}

function toggleHist(rowId) {
  const el = document.getElementById('hist-' + rowId);
  if (el) el.classList.toggle('visible');
}

async function carregarLogs() {
  const todos = await window.AppAuth.listarLogs();
  logsByRow = {};
  todos.forEach(l => {
    if (!logsByRow[l.row_id]) logsByRow[l.row_id] = [];
    logsByRow[l.row_id].push(l);
  });
}

async function recarregar() {
  const btn = document.getElementById('btnRecarregar');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading"></span> atualizando...'; }
  estado = await window.AppAuth.carregarEstado();
  await carregarLogs();
  const todasRows = (estado && estado.rows) ? estado.rows.length : 0;
  const delegando = (estado && estado.rows) ? estado.rows.filter(r => r.delegar).length : 0;
  console.log('[Gestão] Carregado do Supabase:', todasRows, 'atividades total,', delegando, 'marcadas para delegar');
  if (delegando === 0 && todasRows > 0) {
    console.warn('[Gestão] ATENÇÃO: você tem', todasRows, 'atividades, mas nenhuma marcada com delegar=true. Volta na ferramenta e marca o checkbox "Delegar?"');
  }
  renderStats();
  renderPrioridade();
  renderFilters();
  renderList();
  if (btn) { btn.disabled = false; btn.innerHTML = window.Icons.arrowRight + ' atualizar'; }
}

(async function() {
  try {
    const session = await window.AppAuth.requireAuth();
    if (!session) return;
    await window.renderHeader('gestao');
    // popula ícones estáticos
    const iconReload = document.getElementById('iconReload');
    if (iconReload) iconReload.innerHTML = window.Icons.arrowRight;
    await recarregar();
  } catch (err) {
    console.error('[Gestão] Erro na inicialização:', err);
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) {
      overlay.innerHTML = '<div style="background:white;padding:32px;border-radius:12px;max-width:520px;text-align:left;border:1px solid #c63939;">' +
        '<h2 style="font-family:Fraunces,serif;font-size:22px;color:#c63939;margin-bottom:12px;">Erro ao carregar a gestão</h2>' +
        '<pre style="background:#f4f1ea;padding:12px;border-radius:6px;font-size:11px;overflow:auto;max-height:200px;white-space:pre-wrap;">' + ((err && err.message) ? err.message : String(err)) + '</pre>' +
        '<div style="margin-top:18px;"><button onclick="location.reload()" style="padding:10px 16px;border-radius:6px;background:#026a77;color:white;border:none;cursor:pointer;">Tentar de novo</button></div>' +
        '</div>';
    }
    return;
  }
  document.getElementById('loadingOverlay').classList.add('hidden');
})();
</script>

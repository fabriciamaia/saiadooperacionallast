<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar :: Implementare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body {
    background:
      radial-gradient(circle at 20% 0%, var(--teal-soft) 0, transparent 40%),
      radial-gradient(circle at 90% 100%, var(--lime-soft) 0, transparent 40%),
      var(--paper);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .auth-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .auth-card {
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    padding: 44px 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }

  .auth-brand {
    text-align: center;
    margin-bottom: 32px;
  }

  .auth-brand .brand-mark {
    font-size: 28px;
    color: var(--teal);
  }
  .auth-brand .brand-tag {
    display: block;
    margin-top: 4px;
    font-size: 11px;
  }

  .auth-card h1 {
    font-size: 28px;
    margin-bottom: 6px;
  }

  .auth-card .auth-sub {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 28px;
  }

  .auth-form > div + div { margin-top: 14px; }

  .auth-actions { margin-top: 24px; }

  .auth-foot {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .auth-foot a { font-weight: 500; }

  .pass-wrap { position: relative; }
  .pass-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px;
    color: var(--ink-muted);
    border-radius: 4px;
  }
  .pass-toggle:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">Implementare</span>
      <span class="brand-tag">Saia do Operacional</span>
    </div>

    <h1>Entrar</h1>
    <p class="auth-sub">Acesse a ferramenta para organizar o que sai da sua mão.</p>

    <div id="alertSlot"></div>

    <form class="auth-form" id="loginForm" onsubmit="return false;">
      <div>
        <label class="field-label">E-mail</label>
        <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com">
      </div>
      <div>
        <label class="field-label">Senha</label>
        <div class="pass-wrap">
          <input type="password" id="senha" required autocomplete="current-password" placeholder="sua senha">
          <button type="button" class="pass-toggle" onclick="togglePass()" id="passToggle" aria-label="Mostrar/ocultar senha"></button>
        </div>
      </div>
      <div style="text-align: right; font-size: 12px;">
        <a href="recuperar-senha.html">Esqueceu a senha?</a>
      </div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-large btn-block" id="btnEntrar" onclick="entrar()">Entrar</button>
      </div>
    </form>

    <div class="auth-foot">
      Ainda não tem conta?
      <a href="cadastro.html">Criar conta</a>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p>Implementare :: aceleração comercial para profissionais da saúde</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="icons.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  document.getElementById('passToggle').innerHTML = window.Icons.eye;

  function togglePass() {
    const input = document.getElementById('senha');
    const btn = document.getElementById('passToggle');
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = window.Icons.eyeOff;
    } else {
      input.type = 'password';
      btn.innerHTML = window.Icons.eye;
    }
  }

  function showAlert(msg, type) {
    const slot = document.getElementById('alertSlot');
    const cls = type === 'danger' ? 'alert-danger' : (type === 'success' ? 'alert-success' : '');
    slot.innerHTML = `<div class="alert ${cls}">${msg}</div>`;
  }

  // se já tá logado, manda direto pra app
  (async function() {
    if (!window.AppAuth) return;
    const session = await window.AppAuth.getSession();
    if (session) window.location.href = 'app.html';
  })();

  async function entrar() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    if (!email || !senha) {
      showAlert('Preencha email e senha.', 'danger');
      return;
    }

    const btn = document.getElementById('btnEntrar');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span> entrando...';

    const { error } = await window.AppAuth.signIn(email, senha);

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Entrar';
      if (error.message.includes('Invalid login')) {
        showAlert('E-mail ou senha incorretos.', 'danger');
      } else if (error.message.includes('Email not confirmed')) {
        showAlert('Você precisa confirmar seu e-mail antes de entrar. Olha sua caixa de entrada.', 'danger');
      } else {
        showAlert(error.message, 'danger');
      }
      return;
    }

    window.location.href = 'app.html';
  }

  document.getElementById('loginForm').addEventListener('submit', entrar);
  document.getElementById('senha').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') entrar();
  });
</script>

</body>
</html>

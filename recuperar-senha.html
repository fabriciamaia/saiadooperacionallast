<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha :: Implementare</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { background: radial-gradient(circle at 20% 0%, var(--teal-soft) 0, transparent 40%), radial-gradient(circle at 90% 100%, var(--lime-soft) 0, transparent 40%), var(--paper); min-height: 100vh; display: flex; flex-direction: column; }
  .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: var(--white); border: 1px solid var(--line-soft); border-radius: 14px; padding: 44px 40px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
  .auth-brand { text-align: center; margin-bottom: 32px; }
  .auth-brand .brand-mark { font-size: 28px; color: var(--teal); }
  .auth-brand .brand-tag { display: block; margin-top: 4px; font-size: 11px; }
  .auth-card h1 { font-size: 26px; margin-bottom: 6px; }
  .auth-card .auth-sub { font-size: 14px; color: var(--ink-muted); margin-bottom: 28px; }
  .auth-form > div + div { margin-top: 14px; }
  .auth-actions { margin-top: 24px; }
  .auth-foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--ink-muted); }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">Implementare</span>
      <span class="brand-tag">Saia do Operacional</span>
    </div>
    <h1>Recuperar senha</h1>
    <p class="auth-sub">Coloque seu e-mail. Você vai receber um link pra criar uma nova senha.</p>
    <div id="alertSlot"></div>
    <form class="auth-form" id="recForm" onsubmit="return false;">
      <div>
        <label class="field-label">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-large btn-block" id="btnEnviar" onclick="enviar()">Enviar link</button>
      </div>
    </form>
    <div class="auth-foot"><a href="index.html">← Voltar pro login</a></div>
  </div>
</div>

<footer><div class="container"><p>Implementare :: aceleração comercial</p></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="icons.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  function showAlert(msg, type) {
    document.getElementById('alertSlot').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }
  async function enviar() {
    const email = document.getElementById('email').value.trim();
    if (!email) { showAlert('Coloca seu e-mail.', 'danger'); return; }
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.innerHTML = '<span class="loading"></span> enviando...';
    const { error } = await window.AppAuth.resetPassword(email);
    if (error) {
      btn.disabled = false; btn.textContent = 'Enviar link';
      showAlert(error.message, 'danger'); return;
    }
    showAlert('Pronto. Olha sua caixa de e-mail. Se não chegar, confere o spam.', 'success');
    btn.textContent = 'Enviado';
  }
  document.getElementById('recForm').addEventListener('submit', enviar);
</script>

</body>
</html>
